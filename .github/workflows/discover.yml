name: Gemeinden prüfen

on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node collect/discover.mjs
      - run: |
          git config user.name "familienagenda-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discover.json
          git diff --cached --quiet || git commit -m "Gemeinden geprüft"
          git pull --rebase --autostash origin main
          git push

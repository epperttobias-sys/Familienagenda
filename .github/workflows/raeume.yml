name: Räume und Restaurants holen

on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node collect/raeume.mjs
        continue-on-error: true
      - run: node collect/essen.mjs
        continue-on-error: true
      - run: |
          git config user.name "familienagenda-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/raeume.js; git add site/essen.js 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Räume aktualisiert"
          git pull --rebase -X theirs --autostash origin main || (git rebase --abort; git pull --no-rebase -X ours origin main)
          git push

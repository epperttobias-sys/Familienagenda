name: Inhalte übersetzen

on:
  workflow_run:
    workflows: ["Events sammeln"]
    types: [completed]
  schedule:
    - cron: "41 5 * * 1" # wöchentlich für Ausflüge, Spielplätze, Restaurants
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["collect/translate.py"]

permissions:
  contents: write
  actions: write

concurrency:
  group: uebersetzen
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/translate.yml
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-opus-mt-de-en-v1
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install "transformers<5" sentencepiece sacremoses
      - run: python collect/translate.py
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add site/en.js data/en-cache.json
          if git diff --cached --quiet; then echo "Nichts Neues"; exit 0; fi
          git commit -m "Übersetzungen aktualisiert"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
          gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

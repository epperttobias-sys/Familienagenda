name: Events sammeln

on:
  schedule:
    - cron: "17 2 * * *" # jede Nacht um 02.17 Uhr UTC
  workflow_dispatch: # von Hand starten
  push:
    branches: [main]
    paths: ["site/index.html", "collect/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sammeln
  cancel-in-progress: false

jobs:
  sammeln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/lib.test.mjs
      - run: node collect/collect.mjs
      - run: node collect/wetter.mjs
        continue-on-error: true
      - name: Daten speichern
        run: |
          git config user.name "familienagenda-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/events.json site/events.js site/wetter.js 2>/dev/null || git add data site/events.json site/events.js
          git diff --cached --quiet || git commit -m "Events aktualisiert"
          git pull --rebase --autostash origin main
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

name: Pädagogik der Kitas erkennen

on:
  schedule:
    - cron: "23 4 9 * *" # monatlich am 9.
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node collect/paedagogik.mjs
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add site/paedagogik.js data/paedagogik-raw.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Pädagogik der Kitas aktualisiert"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
          gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

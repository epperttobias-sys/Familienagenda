name: Seiten prüfen

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Adressen, mit Leerzeichen getrennt"
        required: true
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node collect/check.mjs
        env:
          URLS: ${{ inputs.urls }}

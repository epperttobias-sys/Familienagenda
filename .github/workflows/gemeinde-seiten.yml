name: Gemeinde-Seiten nach Angeboten durchsuchen

on:
  schedule:
    - cron: "37 3 3 * *" # monatlich am 3.
  workflow_dispatch:
    inputs:
      nur:
        description: "Nur diese Gemeinde-Codes (Komma), leer = alle"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node collect/gemeinde-seiten.mjs
        env:
          NUR: ${{ github.event.inputs.nur }}
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/gemeinde-seiten.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Gemeinde-Seiten: Angebote aktualisiert"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done

name: Vereine, Familienangebote und Ausflugsziele holen

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1" # jeden Montag
permissions:
  contents: write
  actions: write
jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node collect/gemeinden-js.mjs
      - run: node collect/vereine.mjs
        continue-on-error: true
      - run: node collect/familie.mjs
        continue-on-error: true
      - run: node collect/ausflug.mjs
        continue-on-error: true
      - run: node collect/raeume.mjs
        continue-on-error: true
      - run: node collect/essen.mjs
        continue-on-error: true
      - run: node collect/gesundheit.mjs
        continue-on-error: true
      - run: |
          git config user.name "familienagenda-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/vereine.js site/gemeinden.js; git add site/familie.js 2>/dev/null || true; git add site/ausflug.js 2>/dev/null || true; git add site/raeume.js 2>/dev/null || true; git add site/essen.js 2>/dev/null || true; git add site/gesundheit.js 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Vereine und Familienangebote aktualisiert"
          git pull --rebase -X theirs --autostash origin main || (git rebase --abort; git pull --no-rebase -X ours origin main)
          git push
      - name: Seite veröffentlichen
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

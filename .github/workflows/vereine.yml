name: Vereine, Familienangebote und Ausflugsziele holen

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1" # jeden Montag
permissions:
  contents: write
jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node collect/vereine.mjs
        continue-on-error: true
      - run: node collect/familie.mjs
        continue-on-error: true
      - run: node collect/ausflug.mjs
        continue-on-error: true
      - run: |
          git config user.name "familienagenda-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/vereine.js; git add site/familie.js 2>/dev/null || true; git add site/ausflug.js 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Vereine und Familienangebote aktualisiert"
          git pull --rebase --autostash origin main
          git push

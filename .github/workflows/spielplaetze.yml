name: Spielplätze holen

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1" # jeden Montag
permissions:
  contents: write
  actions: write
jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node collect/spielplaetze.mjs
      - run: |
          git config user.name "familienagenda-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/spielplaetze.js
          git diff --cached --quiet || git commit -m "Spielplätze aktualisiert"
          git pull --rebase -X theirs --autostash origin main || (git rebase --abort; git pull --no-rebase -X ours origin main)
          git push
      - name: Seite veröffentlichen
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

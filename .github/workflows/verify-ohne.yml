name: Angebote ohne Website prüfen

on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node collect/verify-ohne.mjs
      - run: |
          git config user.name "familienagenda-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ohne-check.json
          git diff --cached --quiet || git commit -m "Linkliste geprüft"
          git pull --rebase -X theirs --autostash origin main || (git rebase --abort; git pull --no-rebase -X ours origin main)
          git push

name: Standorte der Kita-Ketten holen

on:
  schedule:
    - cron: "47 3 4 * *" # monatlich am 4.
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node collect/ketten.mjs
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/ketten.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Kita-Ketten: Standorte aktualisiert"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
